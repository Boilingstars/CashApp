services:
  # Разработка с HMR: docker compose --profile dev up dev
  # Продакшен: docker compose up --build (из папки CashApp)
  dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    profiles:
      - dev

volumes:
  node_modules:
